name: Build installers

# Unsigned builds (brief §13).
# - Pull requests: build the installers and attach them to the run as artifacts, for testing.
# - Push to main (a merged PR): build, then publish a GitHub Release v0.1.<run number>.
#   Installed apps check that release feed and update themselves (Windows) or offer the new download (Mac).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: '*.dmg'
          - os: windows-latest
            script: dist:win
            artifact: '*.exe'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the release version
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: apps/desktop
        # Same number for both OS jobs of a run, always higher than the last release.
        run: npm pkg set version="0.1.${{ github.run_number }}"
      - name: Build installer (unsigned)
        run: pnpm --filter @h88cro/desktop ${{ matrix.script }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the packaged app.asar for secrets
        shell: bash
        run: node scripts/scan-asar.mjs apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: h88cro-${{ matrix.os }}
          # Installer, plus the update metadata and blockmaps the in-app updater reads.
          path: |
            apps/desktop/release/*/${{ matrix.artifact }}
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml
          if-no-files-found: error

  # Publish only after both installers built and passed the secret scan.
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          ls -R dist
          gh release create "v$VERSION" dist/*/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "H88CRO $VERSION" \
            --notes "Unsigned build from ${{ github.sha }}. Installed apps pick this up automatically."
