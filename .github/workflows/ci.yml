name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit + acceptance tests (rendered tests use the runner's Chrome)
        run: pnpm test
        env:
          H88CRO_CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Build the desktop app
        run: pnpm --filter @h88cro/desktop build
      - name: End-to-end smoke test (Playwright for Electron)
        run: xvfb-run -a node apps/desktop/e2e/smoke.mjs
        env:
          H88CRO_CHROMIUM_PATH: /usr/bin/google-chrome

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (repository history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
