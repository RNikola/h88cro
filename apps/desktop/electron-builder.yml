appId: com.h88cro.desktop
productName: H88CRO
executableName: h88cro
copyright: Copyright © 2026 H88CRO
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - "**/node_modules/lighthouse/**"
# Chromium for Testing is NOT bundled: it is downloaded on first run (keeps the installer small).
mac:
  icon: build/icon.icns
  # Lighthouse pulls in oxc-parser's native binding (via Sentry); it is arch-specific by name, so let the universal merge keep it as is.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/@oxc-parser/**"
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  # Phase 1 ships unsigned builds for internal testing (brief §13). Signing + notarization in Phase 2.
  identity: null
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Per-user install: no admin rights needed (brief §12).
  perMachine: false
  oneClick: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: H88CRO
linux:
  icon: build/icon.png
  target: [dir]
publish:
  # Auto-update feed (Phase 2): GitHub Releases on a release repo.
  provider: github
  owner: RNikola
  repo: h88cro
  releaseType: draft
